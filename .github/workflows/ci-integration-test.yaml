name: Integration Tests
on:
  pull_request:
  workflow_dispatch:
jobs:
  ProjectGeneration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.tool-versions'
          cache: npm
      - run: ./script/ci-project-generation
