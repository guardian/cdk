name: Create and publish a devx-logs (for ECS) Docker image

on:
  pull_request:
    paths:
      - tools/logging/**
  push:
    branches: [main]
    paths:
      - tools/logging/**
  # Run manually
  workflow_dispatch:

jobs:
  build-and-push-image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: tools/logging/go.mod
          cache-dependency-path: tools/logging/go.sum

      - name: Set up Docker
        uses: docker/setup-docker-action@v5.5.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Test logging
        working-directory: tools/logging
        run: go test ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and tag Docker image for ECR
        run: docker buildx build --load --platform linux/amd64,linux/arm64 -t logging:latest tools/logging

      - name: Publish image to ECR
        uses: guardian/actions-ecr/push@v1.0.2
        with:
          app: logging
          roleArn: ${{ secrets.GU_ARTIFACTS_ROLE_ARN }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
